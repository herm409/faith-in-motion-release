# Steps app (/app) and its functions. Headers apply to /app/* only; the landing pages keep their production behavior.
[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

[[headers]]
  for = "/app/*"
  [headers.values]
    Strict-Transport-Security = "max-age=31536000"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
    Content-Security-Policy = "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self'; connect-src 'self'; manifest-src 'self'; worker-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'"

# Do not serve server source or working notes. (/app/tools and /app/*.md are 404ed in _redirects, ahead of the /app/* rule.)
[[redirects]]
  from = "/netlify/*"
  to = "/404"
  status = 404
  force = true

[[redirects]]
  from = "/netlify.toml"
  to = "/404"
  status = 404
  force = true

[[redirects]]
  from = "/COMP-NOTES.md"
  to = "/404"
  status = 404
  force = true

[[redirects]]
  from = "/DESIGN.md"
  to = "/404"
  status = 404
  force = true

[[redirects]]
  from = "/LAUNCH-RESEARCH.md"
  to = "/404"
  status = 404
  force = true

[[redirects]]
  from = "/README.md"
  to = "/404"
  status = 404
  force = true

[[redirects]]
  from = "/RESTYLE-REFS.md"
  to = "/404"
  status = 404
  force = true
