<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="robots" content="noindex, nofollow" />
  <title>Forms — Faith in Motion</title>
</head>
<body>
  <!-- Static copy of the signup form so Netlify Forms detection always finds "notify" (rev 2026-09-30b). Not linked from the site. -->
  <form name="notify" method="POST" netlify netlify-honeypot="_honey" hidden>
    <input type="hidden" name="form-name" value="notify" />
    <input type="text" name="_honey" />
    <input type="text" name="name" />
    <input type="email" name="email" />
  </form>
</body>
</html>
